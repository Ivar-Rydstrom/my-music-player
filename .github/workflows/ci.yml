name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: swift test

      - name: Build the app
        run: |
          xcodebuild -project StillPlayer.xcodeproj -scheme StillPlayer -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build -quiet
