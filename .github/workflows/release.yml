name: Release

# Push a tag such as v0.2.0 (or run scripts/release.sh 0.2.0) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: swift test

      - name: Import the release signing certificate
        env:
          P12_BASE64: ${{ secrets.STILL_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.STILL_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::Missing STILL_SIGNING_P12_BASE64 or STILL_SIGNING_P12_PASSWORD. Run scripts/create-signing-certificate.sh --upload."
            exit 1
          fi
          keychain="$RUNNER_TEMP/still-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/still-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/still-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/still-signing.p12"
          # Self-signed, so it's listed as untrusted; codesign accepts it by hash.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/\)/ { print $2; exit }')
          [[ -n "$identity" ]] || { echo "::error::No signing identity in the imported certificate."; exit 1; }
          echo "STILL_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, and package
        run: zsh scripts/build-release.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Still $version" --generate-notes "${flags[@]}" \
            --notes "**First install:** open \`Still-$version.dmg\`, drag Still to Applications, then right-click it and choose Open (or allow it under System Settings > Privacy & Security). Still updates itself after that."

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/still-signing.keychain-db" 2>/dev/null || true
